<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Comissionamento - HVAC</title>
  <meta name="theme-color" content="#10151A" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body>
  <div id="app">
    <!-- As telas são renderizadas dinamicamente pelo app.js -->
    <div id="root"></div>
  </div>

  <!-- Input oculto para captura de foto via câmera -->
  <input id="camera-input" type="file" accept="image/*" capture="environment" style="display:none" />
  <input id="art-input" type="file" accept="image/*,application/pdf" style="display:none" />

  <script src="js/supabase-client.js" defer></script>
  <script src="js/app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
